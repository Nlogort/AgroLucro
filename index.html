<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroLucro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">AgroLucro</div>

        <nav>
            <a href="#calculadora">Calculadora</a>
            <a href="#historico">Minhas Cargas</a>

        </nav>

    </header>

    <main>
        <section id="calculadora" class="container">

            <div class="campo">

                <label for="busca-produto">Digite o nome do produto:</label>
                <input type="search" id="busca-produto" placeholder="buscar produto" list="produtos-sugeridos"
                    autocomplete="off">
                <button type="submit" id="btn-buscar">Buscar</button>

                <!--Caixa onde as divs de resultado vao aparecer-->
                <div id="lista-resultados" class="caixa-resultados"></div>

                <datalist id="produtos-sugeridos"></datalist>
<!--LOCAL QUE SELECIONA SE VOCE PRODUS OU APEMAS COMPRA-->
                <div class="seletor-perfil">
                    <button class="aba-perfil ativo" onclick="mudarPerfil('comprador')" id="btn-comprador">Sou Comprador /
                        Feirante</button>
                    <button class="aba-perfil" onclick="mudarPerfil('produtor')" id="btn-produtor">Sou Produtor / Agricultor</button>
                </div>
<!--/////////////////////////////////////////////////////////-->

                <div id="painel-calculadora" class="painel-escondido">
                    <h2>Calculadora de Carga</h2>
                    <p>produto selecionado <span id="calc-nome-produto"></span></p>
                    <p>Preço CEASA: R$ <span id="calc-preco-ceasa"></span></p>
<div id="form-comprador">
    
                        <div class="inputs-calculo">
                            <label for="calc-quantidade">Quantidade (caixas/unid):</label>
                            <input type="number" id="calc-quantidade" value="1" min="1">
    
                            <label for="calc-frete">Valor do Frete (R$):</label>
                            <input type="number" id="calc-frete" value="0" min="0" step="0.01" placeholder="Ex: 150.00">
    
                            <label for="calc-margem">Margem de Lucro desejada (%):</label>
                            <input type="number" id="calc-margem" value="30" min="0">
                        </div>
    
                        <div class="resultados-calculo">
                            <p>Custo Total (Produtos + Frete): R$ <span id="res-custo-total">0.00</span></p>
                            <p>Custo Real por Unidade: R$ <span id="res-custo-unitario">0.00</span></p>
                            <p>Preço de Venda Sugerido (Total): R$ <span id="res-venda-total">0.00</span></p>
                            <p>Lucro Líquido Estimado: R$ <span id="res-lucro">0.00</span></p>
    
                            <button onclick="calcularMargem()">calcular</button>
</div>

<div id="form-produtor" class="escondido">
<h3>Calculadora do produtor</h3>
</div>

                    </div>
                </div>

            
           
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
